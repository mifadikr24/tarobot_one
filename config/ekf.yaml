ekf_filter_node:
  ros__parameters:

    # ===========================
    # General
    # ===========================
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true

    publish_tf: true
    publish_acceleration: false

    transform_time_offset: 0.0
    transform_timeout: 0.2

    print_diagnostics: true
    debug: false

    reset_on_time_jump: true

    # ===========================
    # Frames
    # ===========================

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # ======================================================
    # Wheel Odometry
    # ======================================================

    odom0: /diff_cont/odom
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    odom0_pose_rejection_threshold: 5.0
    odom0_twist_rejection_threshold: 1.0

    odom0_config: [
        true,  true,  false,
        false, false, true,
        true,  false, false,
        false, false, true,
        false, false, false
    ]

    # ======================================================
    # IMU
    # ======================================================

    imu0: /imu

    imu0_queue_size: 20
    imu0_nodelay: true

    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

    imu0_pose_rejection_threshold: 0.8
    imu0_twist_rejection_threshold: 0.8
    imu0_linear_acceleration_rejection_threshold: 1.5

    imu0_config: [
        false, false, false,
        false, false, true,
        false, false, false,
        false, false, true,
        true,  false, false
    ]

    # ======================================================
    # Initial Covariance
    # ======================================================

    initial_estimate_covariance: [
